x-app: &app
  build:
    context: .
    target: app
  environment: &app-env
    DATABASE_URL: postgresql://housefull:housefull@db:5432/housefull
    GOOGLE_CLOUD_PROJECT: housefull-local
    PUBSUB_TOPIC: bookings
    PUBSUB_EMULATOR_HOST: pubsub:8085
    JWT_SECRET: local-development-only-not-a-real-secret
    COOKIE_SECURE: "false"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: housefull
      POSTGRES_PASSWORD: housefull
      POSTGRES_DB: housefull
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housefull"]
      interval: 2s
      timeout: 3s
      retries: 20

  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --project=housefull-local --host-port=0.0.0.0:8085
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085 >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: python -m scripts.migrate
    depends_on:
      db:
        condition: service_healthy

  pubsub-init:
    <<: *app
    command: python -m scripts.init_pubsub
    depends_on:
      pubsub:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "${HOUSEFULL_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      pubsub-init:
        condition: service_completed_successfully

  worker:
    <<: *app
    environment:
      <<: *app-env
      APP_MODULE: housefull.worker:app
    depends_on:
      migrate:
        condition: service_completed_successfully

  expire-holds:
    <<: *app
    profiles: ["jobs"]
    command: python -m scripts.expire_holds
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Throwaway database, so test runs never add data to the app.
  test-db:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: housefull
      POSTGRES_PASSWORD: housefull
      POSTGRES_DB: housefull
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housefull"]
      interval: 2s
      timeout: 3s
      retries: 20

  tests:
    build:
      context: .
      target: test
    profiles: ["test"]
    command: sh -c "python -m scripts.migrate && python -m pytest -q -p no:cacheprovider"
    environment:
      DATABASE_URL: postgresql://housefull:housefull@test-db:5432/housefull
      GOOGLE_CLOUD_PROJECT: housefull-local
      PUBSUB_TOPIC: bookings
      JWT_SECRET: test-only-secret-at-least-32-bytes-long
      COOKIE_SECURE: "false"
    depends_on:
      test-db:
        condition: service_healthy
