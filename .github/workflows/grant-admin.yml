name: Grant admin

on:
  workflow_dispatch:
    inputs:
      email:
        description: Email of a registered account
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  grant:
    name: Grant admin
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Hide the email in logs
        env:
          EMAIL: ${{ inputs.email }}
        run: echo "::add-mask::$EMAIL"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - env:
          EMAIL: ${{ inputs.email }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          gcloud run jobs execute housefull-make-admin --project "$PROJECT" \
            --region asia-south1 --args "$EMAIL" --wait --quiet
